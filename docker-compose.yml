services:
  api:
    build: ./server
    environment:
      MONGO_URL: ${MONGO_URL:?defina MONGO_URL no .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: "3002"
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
