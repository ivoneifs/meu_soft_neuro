services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soft_neuro
      POSTGRES_PASSWORD: soft_neuro
      POSTGRES_DB: soft_neuro
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./server
    environment:
      # Por padrão usa o Postgres deste compose; em produção aponta para o Postgres do Coolify.
      DATABASE_URL: ${DATABASE_URL:-postgres://soft_neuro:soft_neuro@postgres:5432/soft_neuro}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ivonei.admin@neuro.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-151230}
      PORT: "3002"
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg-data:
