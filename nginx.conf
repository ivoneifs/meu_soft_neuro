server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Encaminha /api para o backend.
    #
    # Em produção (Coolify/Traefik) o roteador de /api já aponta direto para o
    # container do server, então este bloco nem chega a ser usado. Ele existe
    # para o docker-compose local, onde o backend é o serviço "api".
    #
    # proxy_pass com variável + resolver do Docker: a resolução de DNS acontece
    # em runtime, não no boot — assim o nginx sobe mesmo que "api" não exista
    # (ex.: deploy só do frontend).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api api:3002;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
